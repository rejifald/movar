name: Safari credentials audit

# Read-only diagnosis of the Apple release credentials. Nothing here builds,
# signs, uploads, notarizes, creates, or revokes anything — every Apple call is
# a GET.
#
# Why it exists: `release-safari` and `safari-signing-rehearsal` both fail at
# the archive step with
#
#   Communication with Apple failed: A non-HTTP 200 response was received (401)
#   for URL https://appstoreconnect.apple.com/xcbuild/.../listTeams.action
#   No profiles for 'fyi.movar.safari' were found
#
# That call comes from Xcode's automatic signing and uses ONLY the App Store
# Connect API key triple. Those runs tell you *something* is wrong but not
# *which* secret — and the .p12 certs are never reached, so their health is
# unknown too. This workflow checks each credential independently and prints a
# per-secret verdict, so a rotation replaces exactly what is broken.
#
# Deliberately NOT in the `production` environment: it publishes nothing, so it
# should run unattended rather than burning an approval click.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safari-credentials-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    # macOS: `security` (keychain import, exactly as the release job does it)
    # and `xcrun notarytool` (the notary service is a separate auth path from
    # the xcbuild one that 401s, so it's worth probing on its own).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      # Presence only — report, never fail. A missing secret is a finding, and
      # we want the rest of the audit to still run.
      - name: Which secrets are set
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          APPLE_ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
          APPLE_DIST_CERT_P12_BASE64: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 }}
          APPLE_DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          APPLE_DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          {
            echo "## Secret presence"
            echo
            echo "| Secret | Set |"
            echo "| --- | --- |"
            for v in APPLE_TEAM_ID APPLE_ASC_KEY_ID APPLE_ASC_ISSUER_ID APPLE_ASC_API_KEY_P8 \
              APPLE_DIST_CERT_P12_BASE64 APPLE_DIST_CERT_PASSWORD \
              APPLE_DEVELOPER_ID_CERT_P12_BASE64 APPLE_DEVELOPER_ID_CERT_PASSWORD; do
              if [ -n "${!v}" ]; then echo "| \`$v\` | ✅ |"; else echo "| \`$v\` | ❌ missing |"; fi
            done
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # Inspect both .p12s the way the release job does (throwaway keychain +
      # `security import`), then pull the metadata the keychain won't tell us:
      # subject, team OU, expiry, and the serial we cross-check against Apple's
      # certificate list in the next step. A .p12 can import cleanly and still
      # be revoked upstream — the runner only verifies the password and key pair.
      - name: Inspect the signing certificates
        id: certs
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DIST_CERT_P12_BASE64: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 }}
          APPLE_DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          APPLE_DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -uo pipefail

          KEYCHAIN="$RUNNER_TEMP/audit.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          echo "## Signing certificates" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"

          # Keychain Access writes legacy-algorithm .p12s that OpenSSL 3 rejects
          # without -legacy, while LibreSSL (/usr/bin/openssl) reads them
          # directly. Try the system one first, then brew's with -legacy.
          read_cert() { # <p12> <password>
            /usr/bin/openssl pkcs12 -in "$1" -passin "pass:$2" -nokeys -clcerts -nomacver 2>/dev/null \
              || /opt/homebrew/opt/openssl@3/bin/openssl pkcs12 -legacy -in "$1" -passin "pass:$2" -nokeys -clcerts 2>/dev/null
          }

          audit_p12() { # <label> <base64> <password> <output-name>
            local label="$1" b64="$2" pw="$3" out="$4"
            if [ -z "$b64" ]; then
              echo "- **$label**: secret not set." >> "$GITHUB_STEP_SUMMARY"
              return
            fi
            local p12="$RUNNER_TEMP/$out.p12"
            if ! echo "$b64" | base64 --decode > "$p12" 2>/dev/null; then
              echo "- **$label**: ❌ secret is not valid base64." >> "$GITHUB_STEP_SUMMARY"
              return
            fi

            # Password + private-key check, identical to the release job.
            local imported
            if imported=$(security import "$p12" -k "$KEYCHAIN" -P "$pw" -T /usr/bin/codesign 2>&1); then
              echo "- **$label**: ✅ imports into a keychain ($imported)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- **$label**: ❌ \`security import\` failed — wrong password, or the .p12 carries no private key. Detail: \`$imported\`" >> "$GITHUB_STEP_SUMMARY"
              return
            fi

            local pem subject enddate serial
            pem=$(read_cert "$p12" "$pw")
            if [ -z "$pem" ]; then
              echo "  - could not parse the certificate for metadata (import still succeeded)." >> "$GITHUB_STEP_SUMMARY"
              return
            fi
            subject=$(echo "$pem" | /usr/bin/openssl x509 -noout -subject 2>/dev/null)
            enddate=$(echo "$pem" | /usr/bin/openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
            serial=$(echo "$pem" | /usr/bin/openssl x509 -noout -serial 2>/dev/null | cut -d= -f2)
            echo "  - $subject" >> "$GITHUB_STEP_SUMMARY"
            echo "  - expires: $enddate — serial: \`$serial\`" >> "$GITHUB_STEP_SUMMARY"
            # Expired locally is decisive on its own; no need to ask Apple.
            if ! /usr/bin/openssl x509 -checkend 0 -noout <<< "$pem" >/dev/null 2>&1; then
              echo "  - ❌ **this certificate has EXPIRED** — it must be recreated and re-exported." >> "$GITHUB_STEP_SUMMARY"
            fi
            # The OU of an Apple signing cert is the Team ID; a mismatch means
            # the cert belongs to a different team than APPLE_TEAM_ID claims.
            if [ -n "${APPLE_TEAM_ID:-}" ] && ! grep -q "OU *= *$APPLE_TEAM_ID" <<< "$subject"; then
              echo "  - ⚠️ subject OU does not match \`APPLE_TEAM_ID\` — the cert may belong to another team." >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "${out}_serial=$serial" >> "$GITHUB_OUTPUT"
          }

          audit_p12 "Apple Distribution (APPLE_DIST_CERT_P12_BASE64)" \
            "${APPLE_DIST_CERT_P12_BASE64:-}" "${APPLE_DIST_CERT_PASSWORD:-}" dist
          audit_p12 "Developer ID Application (APPLE_DEVELOPER_ID_CERT_P12_BASE64)" \
            "${APPLE_DEVELOPER_ID_CERT_P12_BASE64:-}" "${APPLE_DEVELOPER_ID_CERT_PASSWORD:-}" devid

          echo >> "$GITHUB_STEP_SUMMARY"
          # Names of the identities the release job would sign with.
          echo "Codesigning identities the release job would see:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          security find-identity -v -p codesigning "$KEYCHAIN" >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # The main event: probe the App Store Connect API key directly and work
      # out which part of the triple (or which missing access) causes the 401.
      - name: Audit the App Store Connect API key
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          APPLE_ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
          APPLE_DIST_CERT_SERIAL: ${{ steps.certs.outputs.dist_serial }}
          APPLE_DEVID_CERT_SERIAL: ${{ steps.certs.outputs.devid_serial }}
        run: node scripts/apple-credentials-audit.mjs

      # Notarization authenticates against Apple's notary service, not the
      # xcbuild endpoint that 401s. Probing it separately tells us whether the
      # key is wholly dead or only unauthorised for provisioning — `history` is
      # a read.
      - name: Probe the notary service with the same key
        if: always()
        env:
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          APPLE_ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
        run: |
          set -uo pipefail
          if [ -z "${APPLE_ASC_API_KEY_P8:-}" ]; then
            echo "APPLE_ASC_API_KEY_P8 not set — skipping notary probe."
            exit 0
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_ASC_API_KEY_P8" | base64 --decode > "$KEY_PATH"
          {
            echo "## Notary service (\`xcrun notarytool history\`)"
            echo
            echo '```'
            xcrun notarytool history --key "$KEY_PATH" --key-id "${APPLE_ASC_KEY_ID:-}" \
              --issuer "${APPLE_ASC_ISSUER_ID:-}" 2>&1 | head -40
            echo '```'
            echo
            echo "A successful listing here means the key authenticates for notarization even if provisioning access is missing."
          } >> "$GITHUB_STEP_SUMMARY"
