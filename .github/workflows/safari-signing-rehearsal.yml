name: Safari signing rehearsal

# Manual, NON-publishing dry run of the App Store signing path. It archives both
# schemes with the real Apple Distribution cert, exports the .ipa/.pkg, and runs
# `altool --validate-app` — which checks the packages against App Store Connect
# WITHOUT submitting them. This is the pre-release confidence release-safari
# itself can't give safely: its dispatch path (dry_run=false) publishes for real,
# so there is no upload-free rehearsal there. Run this before a release whenever
# you've touched the wrapper, signing config, provisioning, or entitlements.
#
# It deliberately does NOT exercise the Developer ID cert / notarization — those
# only matter for the direct-download .dmg, which has no equivalent App Store
# pre-flight validator. `safari-wrapper.yml` covers the unsigned compile; this
# covers signing + export + store validation.
#
# It creates/refreshes provisioning profiles in the Apple account — now
# explicitly, via scripts/apple-provisioning.mjs, rather than as a side effect
# of -allowProvisioningUpdates. Those profiles are reusable and are exactly the
# ones the release job signs with, so creating them here is the point rather
# than a cost. It still submits nothing.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safari-signing-rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Fail loud (not skip-green): you explicitly asked to rehearse signing, so
      # a missing credential should be an obvious red X, not a silent no-op.
      - name: Check Apple signing credentials
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          APPLE_ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
          APPLE_DIST_CERT_P12_BASE64: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 }}
          APPLE_DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          for v in APPLE_TEAM_ID APPLE_ASC_KEY_ID APPLE_ASC_ISSUER_ID \
            APPLE_ASC_API_KEY_P8 APPLE_DIST_CERT_P12_BASE64 APPLE_DIST_CERT_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set — cannot rehearse signing (see docs/safari-deploy.md)"
              exit 1
            fi
          done

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @movar/extension build:safari
      # Host-app Resources live in a separate package from the web extension
      # (host-app.js/.css + localized Main.html under `Shared (App)/Resources/`);
      # the Xcode 'App' target references them, so archiving needs them synced too.
      - run: pnpm --filter @movar/safari-host-app build
      # The audit engine's `engine.js` is referenced by the App target too, and
      # is a build artefact a fresh runner does not have — archiving without it
      # fails the same way. Built, never fetched: shipping it inside the bundle
      # is what keeps this store-compliant.
      - run: pnpm --filter @movar/audit-engine build

      # Xcode selection is a FLOOR, not an exact pin — keep in sync with
      # release.yml / safari-wrapper.yml.
      #
      # It used to pin `/Applications/Xcode_16.4.app` exactly, for
      # reproducibility. That is what an exact pin costs you here: Apple raises
      # the minimum SDK over time, and on 2026-08-11 a signed, correctly
      # exported .ipa was rejected by App Store Connect with
      #
      #   Validation failed (409) SDK version issue. This app was built with the
      #   iOS 18.5 SDK. All iOS and iPadOS apps must be built with the iOS 26
      #   SDK or later, included in Xcode 26 or later.
      #
      # A pin cannot be "correct" indefinitely against a moving external floor,
      # so express the actual constraint: newest installed Xcode at or above
      # MIN_XCODE_MAJOR. The exact choice is logged on every run, and the whole
      # list is printed so a toolchain change is visible rather than silent.
      - name: Select Xcode
        run: |
          set -euo pipefail
          MIN_XCODE_MAJOR=26

          echo "Xcode versions on this runner:"
          best=""; best_version=""
          for candidate in /Applications/Xcode*.app; do
            [ -d "$candidate" ] || continue
            version="$(/usr/bin/defaults read "$candidate/Contents/Info" CFBundleShortVersionString 2>/dev/null || echo '?')"
            echo "  $candidate → $version"
            case "$version" in ''|'?') continue ;; esac
            [ "${version%%.*}" -ge "$MIN_XCODE_MAJOR" ] 2>/dev/null || continue
            # sort -V puts the higher version last, so the newest wins.
            if [ -z "$best" ] || [ "$(printf '%s\n%s\n' "$best_version" "$version" | sort -V | tail -1)" = "$version" ]; then
              best="$candidate"; best_version="$version"
            fi
          done

          if [ -z "$best" ]; then
            echo "::error::No Xcode >= $MIN_XCODE_MAJOR on this runner — App Store Connect rejects anything built with an older SDK. Move to a runner image that ships one."
            exit 1
          fi

          echo "Selected $best ($best_version)"
          sudo xcode-select -s "$best/Contents/Developer"
          echo "DEVELOPER_DIR=$best/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Archive, export, and validate (no upload)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          APPLE_ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
          APPLE_DIST_CERT_P12_BASE64: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 }}
          APPLE_DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          APPLE_INSTALLER_CERT_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERT_P12_BASE64 }}
          APPLE_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          PROJECT="apps/extension/safari/Movar/Movar.xcodeproj"
          # CFBundleVersion. A Unix timestamp, matching the manual macOS
          # submissions (docs/safari-deploy.md records builds 1784330980,
          # 1784636665, …). The Mac App Store requires each upload's build
          # number to EXCEED the last accepted one for the app — across
          # marketing versions, not just within one.
          #
          # This used github.run_number, which is monotonic but tiny: run 9
          # against a previously accepted 1785959230. App Store Connect
          # rejected it with `must contain a higher version than that of the
          # previously uploaded version`. The two schemes cannot be mixed once
          # timestamps are in the history, and a timestamp is monotonic by
          # construction, so timestamps win.
          BUILD_NUMBER="$(date +%s)"
          KEY_PATH="$HOME/.private_keys/AuthKey_${APPLE_ASC_KEY_ID}.p8"

          # --- throwaway keychain + Distribution cert (App Store path only) ---
          KEYCHAIN="$RUNNER_TEMP/movar-signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$APPLE_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$APPLE_DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild

          # A macOS App Store submission is a .pkg, and the .pkg is signed with
          # a DIFFERENT certificate from the .app inside it: `Apple
          # Distribution` signs the app, `Mac Installer Distribution` signs the
          # installer. Without it, everything passes until the very last macOS
          # export, which fails with `No signing certificate "Mac Installer
          # Distribution" found` — after the iOS .ipa has already been built.
          HAVE_INSTALLER=0
          if [ -n "${APPLE_INSTALLER_CERT_P12_BASE64:-}" ]; then
            echo "$APPLE_INSTALLER_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/installer.p12"
            security import "$RUNNER_TEMP/installer.p12" -k "$KEYCHAIN" -P "${APPLE_INSTALLER_CERT_PASSWORD:-}" -T /usr/bin/codesign -T /usr/bin/productbuild
            HAVE_INSTALLER=1
          fi

          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -d user -s "$KEYCHAIN"

          # Xcode matches `installerSigningCertificate` against the identity's
          # name, and Apple's naming for this certificate has drifted — the
          # error message says "Mac Installer Distribution" while the CN says
          # "3rd Party Mac Developer Installer". Read the real name out of the
          # keychain instead of hardcoding either. Installer certs are not a
          # codesigning policy, so this lists identities without `-p codesigning`.
          echo "Identities in the signing keychain:"
          security find-identity -v "$KEYCHAIN" || true
          INSTALLER_IDENTITY="$(security find-identity -v "$KEYCHAIN" \
            | sed -n 's/.*"\(.*Installer.*\)".*/\1/p' | head -1)"
          if [ "$HAVE_INSTALLER" = 1 ] && [ -z "$INSTALLER_IDENTITY" ]; then
            echo "::error::The installer .p12 imported but no identity whose name contains 'Installer' is in the keychain — is APPLE_INSTALLER_CERT_P12_BASE64 really a Mac Installer Distribution certificate?"
            exit 1
          fi
          echo "Installer identity: ${INSTALLER_IDENTITY:-<none>}"

          # --- App Store Connect API key (profiles + altool validation) ---
          mkdir -p "$HOME/.private_keys" "$HOME/.appstoreconnect/private_keys"
          echo "$APPLE_ASC_API_KEY_P8" | base64 --decode > "$KEY_PATH"
          cp "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/"

          VERSION="$(node -p "require('./apps/extension/package.json').version")"
          VERS=( MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" )

          # --- provisioning profiles, bound to the cert we actually hold ---
          # MANUAL signing throughout. Automatic signing fails here in two
          # separate ways: `-exportArchive` needs cloud signing, which this team
          # cannot do (`Cloud signing permission error`, even with an Admin key
          # and no DISTRIBUTION_MANAGED certificate ever issued), and the
          # archive minted a throwaway `Apple Development` certificate on every
          # run against Apple's per-team cap. Manual signing does neither: no
          # Developer-portal round-trip happens during the build at all.
          #
          # The serial ties each profile to the certificate in THIS keychain —
          # a profile bound to some other distribution cert fails at signing
          # with an error that reads like a profile problem.
          DIST_SERIAL="$(/usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/dist.p12" \
            -passin "pass:$APPLE_DIST_CERT_PASSWORD" -nokeys -clcerts -nomacver 2>/dev/null \
            | /usr/bin/openssl x509 -noout -serial | cut -d= -f2)"

          # No APPLE_DEVID_CERT_SERIAL: the rehearsal covers only the App Store
          # path, so the script skips the Developer ID plan.
          APPLE_DIST_CERT_SERIAL="$DIST_SERIAL" OUTPUT_DIR="$RUNNER_TEMP/exportOptions" \
          APPLE_INSTALLER_IDENTITY="$INSTALLER_IDENTITY" \
            node scripts/apple-provisioning.mjs

          # `$(PRODUCT_BUNDLE_IDENTIFIER)` is expanded by xcodebuild PER TARGET,
          # so one setting resolves the app and its extension to their own
          # profiles — xcodebuild has no way to pass per-target flags. Single
          # quotes keep bash from touching it.
          SIGN=( CODE_SIGN_STYLE=Manual "CODE_SIGN_IDENTITY=Apple Distribution" )

          # --- archive iOS + macOS ---
          xcodebuild -project "$PROJECT" -scheme "Movar (iOS)" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Movar-iOS.xcarchive" \
            "${VERS[@]}" "${SIGN[@]}" \
            'PROVISIONING_PROFILE_SPECIFIER=movar $(PRODUCT_BUNDLE_IDENTIFIER) ios-appstore' \
            archive
          xcodebuild -project "$PROJECT" -scheme "Movar (macOS)" -configuration Release \
            -destination 'generic/platform=macOS' -archivePath "$RUNNER_TEMP/Movar-macOS.xcarchive" \
            "${VERS[@]}" "${SIGN[@]}" \
            'PROVISIONING_PROFILE_SPECIFIER=movar $(PRODUCT_BUNDLE_IDENTIFIER) mac-appstore' \
            archive

          # --- export the App Store packages ---
          # The plists are generated alongside the profiles, so the profile
          # names in them can never drift from the profiles that exist.
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Movar-iOS.xcarchive" \
            -exportPath "$RUNNER_TEMP/appstore-ios" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions/app-store-ios.plist"
          if [ "$HAVE_INSTALLER" = 1 ]; then
            xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Movar-macOS.xcarchive" \
              -exportPath "$RUNNER_TEMP/appstore-mac" \
              -exportOptionsPlist "$RUNNER_TEMP/exportOptions/app-store-mac.plist"
          else
            echo "::warning::APPLE_INSTALLER_CERT_P12_BASE64 is not set — skipping the macOS .pkg export and validation. iOS is still fully exercised. See docs/safari-deploy.md."
          fi

          # --- VALIDATE against App Store Connect — the key difference from
          #     release-safari: --validate-app, never --upload-app. Nothing is
          #     submitted; this only confirms the packages would be accepted. ---
          # altool EXITS 0 EVEN WHEN VALIDATION FAILS — a run went green on
          # 2026-08-11 while the macOS package was rejected outright. Its exit
          # code cannot gate anything; the JSON report is the source of truth.
          altool_checked() { # <label> <altool args...>
            local label="$1"; shift
            local out="$RUNNER_TEMP/altool-$label.json"
            local err="$RUNNER_TEMP/altool-$label.log"
            local rc=0
            # Streams stay SEPARATE: altool writes its progress and its
            # "VERIFY SUCCEEDED" banner to stderr, and folding that into the
            # JSON makes the report unparseable — which this gate would then
            # read as failure on a perfectly good package.
            xcrun altool "$@" --output-format json > "$out" 2>"$err" || rc=$?
            cat "$err" "$out"
            node -e '
              const fs = require("node:fs");
              let report;
              try {
                report = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              } catch {
                // Unparseable output is not evidence of success.
                console.error("altool produced no parseable JSON report.");
                process.exit(1);
              }
              const errors = report["product-errors"] ?? [];
              if (errors.length) {
                console.error(errors.map((e) => e.message ?? JSON.stringify(e)).join("\n"));
                process.exit(1);
              }
            ' "$out" || {
              echo "::error::altool $label reported errors (exit code was $rc, which altool does not set reliably)"
              return 1
            }
            [ "$rc" = 0 ] || { echo "::error::altool $label exited $rc"; return 1; }
          }

          altool_checked ios --validate-app -t ios \
            -f "$(ls "$RUNNER_TEMP"/appstore-ios/*.ipa)" \
            --apiKey "$APPLE_ASC_KEY_ID" --apiIssuer "$APPLE_ASC_ISSUER_ID"
          if [ "$HAVE_INSTALLER" = 1 ]; then
            altool_checked macos --validate-app -t macos \
              -f "$(ls "$RUNNER_TEMP"/appstore-mac/*.pkg)" \
              --apiKey "$APPLE_ASC_KEY_ID" --apiIssuer "$APPLE_ASC_ISSUER_ID"
          fi

          echo "Safari signing rehearsal OK — both packages validated against App Store Connect; nothing submitted."
