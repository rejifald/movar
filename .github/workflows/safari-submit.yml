name: Safari submit for review

# Takes an already-uploaded App Store build the rest of the way: creates the
# version, attaches the build once Apple finishes processing it, fills in
# "What's New" for every localization, answers export compliance, and submits
# for review — for iOS and macOS.
#
# THIS IS NO LONGER THE NORMAL PATH — release.yml's `submit-safari` job is.
#
# Submission used to live only here, as a manual `workflow_dispatch` someone
# had to remember after every release. Twice nobody did: v1.7.0 (uploaded
# 2026-08-22) and v1.9.0 (uploaded 2026-09-20) each ended as a green release
# with a build sitting unsubmitted at Apple, while users stayed on the previous
# version. A publishing pipeline whose last step is "remember to do this" does
# not publish, so a published Release now runs `submit-safari` automatically,
# against the exact build it just uploaded.
#
# WHAT THIS WORKFLOW IS FOR NOW
#
#   - RESCUE. `resume` finishes a submission left staged in READY_FOR_REVIEW,
#     which no other mode can advance (scripts/lib/review-resume.mjs). This is
#     the only way out of that state, and it is why the workflow stays.
#   - RE-RUN. If Apple's processing outlasted the automatic job's wait, or a
#     locale's note was wrong, re-run here without rebuilding or re-uploading.
#   - INSPECTION. `plan` prints exactly what a submission would do, reading
#     only — useful before or after a release, and it is how you check a
#     version's real state at Apple.
#   - PREPARE-ONLY. `prepare` stages a version without submitting it, for a
#     release you want to hold or edit by hand in App Store Connect.
#   - BACKFILL. Submitting a version whose release predates the automatic job.
#
# It shares the `safari-submit` concurrency group with that job, so a manual
# run and an automatic one queue rather than race for the same app version.
#
# Every run first prints a PLAN (reads only, no approval needed). Any write is
# behind the `production` environment gate — this workflow keeps that gate
# because, unlike the automatic job, nothing upstream has approved it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version to submit (blank = apps/extension/package.json).'
        type: string
        default: ''
      mode:
        description: 'plan = read-only. prepare = create version, attach build, set notes. submit = also submit for review (irreversible). resume = finish a submission that was staged but never submitted (one PATCH, prepares nothing).'
        type: choice
        options: [plan, prepare, submit, resume]
        default: plan
      platforms:
        description: 'Comma-separated App Store platforms.'
        type: string
        default: 'IOS,MAC_OS'
      build_number:
        description: 'CFBundleVersion to attach (blank = newest processed build for the version).'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Never let two submissions race for the same app.
  group: safari-submit
  cancel-in-progress: false

jobs:
  # Always runs, needs no approval: it is reads-only and its whole purpose is
  # to let you see what the write would do before approving it.
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - id: resolve
        run: |
          set -euo pipefail
          v="${{ inputs.version }}"
          [ -n "$v" ] || v="$(node -p "require('./apps/extension/package.json').version")"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Submitting version $v"

      # Fail here rather than at Apple: App Store Connect rejects a version
      # whose localizations carry no "What's New", and a parser that silently
      # returns nothing would surface as a metadata rejection instead.
      - run: node scripts/lib/release-notes.test.mjs

      # Did the PREVIOUS release actually reach the App Store? A build can be
      # uploaded and never submitted — that is what happened to v1.7.0, which
      # left Safari on 1.6.2 while every other store moved on, and made its
      # users take two releases' worth of change in one step. `gh release list`
      # cannot see it; only Apple knows what Apple received.
      #
      # Report-only until it has produced one correct verdict against real
      # credentials: this check has never run against live App Store Connect
      # data, and a bug in it would block the submission it exists to protect.
      # Flip `STRICT` to '1' once its output has been read and believed once.
      - name: Store parity — did the previous release ship?
        continue-on-error: true
        env:
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          APPLE_ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
          VERSION: ${{ steps.resolve.outputs.version }}
          PLATFORMS: ${{ inputs.platforms }}
          STRICT: '0'
        shell: bash
        run: node scripts/check-store-parity.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Plan (reads only)
        env:
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          APPLE_ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
          VERSION: ${{ steps.resolve.outputs.version }}
          PLATFORMS: ${{ inputs.platforms }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          DRY_RUN: '1'
        # `shell: bash` is NOT cosmetic: the default shell is `bash -e` with
        # NO pipefail, so `node … | tee` reports tee's exit status and a
        # crashed script reads as a green run. Naming the shell gets
        # `-eo pipefail`.
        shell: bash
        run: node scripts/apple-submit.mjs | tee -a "$GITHUB_STEP_SUMMARY"

  apply:
    needs: plan
    # The event check is load-bearing, not belt-and-braces: on any trigger that
    # is not workflow_dispatch, `inputs.mode` is empty, and `'' != 'plan'` is
    # TRUE — so a bare `inputs.mode != 'plan'` would arm the writing job on
    # every such event.
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'plan'
    runs-on: ubuntu-latest
    # Same gate as every store job: a human confirms before anything reaches
    # the listing, and `submit` reaches a reviewer.
    environment: production
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: ${{ inputs.mode == 'resume' && 'RESUME a staged submission' || inputs.mode == 'submit' && 'Prepare and SUBMIT FOR REVIEW' || 'Prepare only' }}
        env:
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          APPLE_ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
          VERSION: ${{ needs.plan.outputs.version }}
          PLATFORMS: ${{ inputs.platforms }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          # Only `submit` sets SUBMIT=1; `prepare` stops before the
          # irreversible step, leaving a version you can still edit by hand.
          SUBMIT: ${{ inputs.mode == 'submit' && '1' || '0' }}
          # `resume` takes a different path entirely: it issues the single
          # PATCH a failed run never landed and prepares nothing. It exists
          # because a version left in READY_FOR_REVIEW cannot be advanced by
          # any other mode — see scripts/lib/review-resume.mjs.
          RESUME: ${{ inputs.mode == 'resume' && '1' || '0' }}
        # `shell: bash` is NOT cosmetic: the default shell is `bash -e` with
        # NO pipefail, so `node … | tee` reports tee's exit status and a
        # crashed script reads as a green run. Naming the shell gets
        # `-eo pipefail`.
        shell: bash
        run: node scripts/apple-submit.mjs | tee -a "$GITHUB_STEP_SUMMARY"
