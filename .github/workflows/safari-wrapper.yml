name: Safari wrapper

# The native Safari app + extension (Xcode project, schemes, Swift, Info/export
# plists) is otherwise compiled only by `release-safari` at release time — and
# that job skips when Apple secrets are absent. That leaves the wrapper with no
# build coverage between releases: a broken project.pbxproj, a renamed resource
# folder reference, or Swift that no longer compiles would surface only on
# release day. This job compiles both schemes unsigned (`CODE_SIGNING_ALLOWED=NO`,
# which is also what keeps it clear of the App Group entitlement's provisioning
# profile — see docs/safari-deploy.md § "Local build") whenever the
# wrapper or its resource-sync scripts change, turning release-day breakage into
# PR-time breakage.
#
# It runs only when the wrapper or its build inputs change, because macOS runner
# minutes cost ~10x Linux (the reason the native build is release-only in the
# first place). Changes that only touch the web-extension JS are already covered
# by the Linux `build:safari` leg in ci.yml, so they don't need a Mac here.
#
# That "only when it changes" decision deliberately does NOT live here as an
# `on.paths` filter, and must not move back. A path-filtered workflow posts no
# check run at all on a PR it skips, so it can never be a required check — a
# required check that never reports leaves every unrelated PR pending forever.
# That is why this job was advisory, and why PR #512 merged a Swift compile
# error into main: the failing check was named `build`, identical to CI's own
# passing `build`, and nothing required either of them.
#
# So this is a `workflow_call` reusable workflow now, the same shape e2e.yml
# uses. ci.yml invokes it as the `safari-archive` job, gated on a cheap Linux
# change-detection job, and folds the result into `ci-gate` — the single
# required status check. Skipped-because-nothing-changed is non-blocking there;
# FAILED blocks the merge. The path list lives next to that job in ci.yml, on
# purpose: whatever decides "does this PR need a Mac?" belongs inside the
# workflow that owns the required check.

on:
  # Invoked by ci.yml — see the `safari-archive` job there. No `push` /
  # `pull_request` trigger: a self-triggering second copy would double-book
  # macOS runners and re-post a check run that gates nothing.
  workflow_call:
  # Manual runs stay available for a one-off "does the wrapper still archive?"
  # without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref. macOS minutes are the whole reason the
# archive is change-gated at all, so don't keep burning them on a commit a newer
# push already obsoletes. When ci.yml calls this workflow, `github.ref` is the
# CALLER's ref (`refs/pull/N/merge` on a PR), so the group is still per-PR.
concurrency:
  group: safari-wrapper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Named `archive`, not `build`. As a check run this surfaces as
  # "safari-archive / archive"; it used to surface as a bare "build", colliding
  # with the `build` job in ci.yml and making a red X unattributable at a glance.
  archive:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Populate the gitignored Extension Resources (empty on a fresh runner):
      # compiling against an empty folder reference would produce an .appex with
      # no manifest. Same first step the release job runs.
      - run: pnpm --filter @movar/extension build:safari

      # Populate the HOST APP's gitignored Resources too. These are a SEPARATE
      # package from the web extension — host-app.js/.css and the localized
      # Main.html shells under `Shared (App)/Resources/`, which the Xcode 'App'
      # target references. build:safari only fills `Shared (Extension)/Resources`,
      # so without this the archive fails with a missing-resource lstat error.
      - run: pnpm --filter @movar/safari-host-app build

      # And the audit engine — `engine.js` under `Shared (App)/Resources/`, which
      # the App target has referenced since the native shell landed. Same
      # missing-resource lstat failure as above if it is skipped. It must be
      # BUILT here rather than fetched at runtime: every store forbids
      # downloading and executing code (docs/native-shells.md, "Store
      # constraints"), so this step is compliance, not convenience.
      - run: pnpm --filter @movar/audit-engine build

      # Same Xcode floor release-safari uses — keep in sync with release.yml /
      # safari-signing-rehearsal.yml. A floor rather than an exact pin because
      # Apple's minimum SDK moves; see the note in release.yml.
      - name: Select Xcode
        run: |
          set -euo pipefail
          MIN_XCODE_MAJOR=26

          echo "Xcode versions on this runner:"
          best=""; best_version=""
          for candidate in /Applications/Xcode*.app; do
            [ -d "$candidate" ] || continue
            version="$(/usr/bin/defaults read "$candidate/Contents/Info" CFBundleShortVersionString 2>/dev/null || echo '?')"
            echo "  $candidate → $version"
            case "$version" in ''|'?') continue ;; esac
            [ "${version%%.*}" -ge "$MIN_XCODE_MAJOR" ] 2>/dev/null || continue
            # sort -V puts the higher version last, so the newest wins.
            if [ -z "$best" ] || [ "$(printf '%s\n%s\n' "$best_version" "$version" | sort -V | tail -1)" = "$version" ]; then
              best="$candidate"; best_version="$version"
            fi
          done

          if [ -z "$best" ]; then
            echo "::error::No Xcode >= $MIN_XCODE_MAJOR on this runner — App Store Connect rejects anything built with an older SDK. Move to a runner image that ships one."
            exit 1
          fi

          echo "Selected $best ($best_version)"
          sudo xcode-select -s "$best/Contents/Developer"
          echo "DEVELOPER_DIR=$best/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      # Unsigned ARCHIVE of both schemes — not just `build`. Archiving runs the
      # install/packaging and product-validation phases a plain build skips, so
      # it mirrors what release-safari does minus the signing/upload. No secrets,
      # no keychain, nothing leaves the runner.
      - name: Archive macOS + iOS schemes (unsigned)
        run: |
          set -euo pipefail
          PROJECT="apps/extension/safari/Movar/Movar.xcodeproj"
          for scheme in "Movar (macOS)" "Movar (iOS)"; do
            dest='generic/platform=macOS'
            case "$scheme" in *'(iOS)'*) dest='generic/platform=iOS' ;; esac
            echo "::group::xcodebuild archive $scheme ($dest)"
            xcodebuild -project "$PROJECT" -scheme "$scheme" -configuration Release \
              -destination "$dest" -archivePath "$RUNNER_TEMP/${scheme// /_}.xcarchive" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
            echo "::endgroup::"
          done
