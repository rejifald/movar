name: Store listing

# App Store screenshot pipeline (tooling/store-listing): the `capture` job builds
# the iOS app, drives a THROWAWAY simulator with Maestro through the curated mock
# sites (src/mock, served by a local MITM proxy), and gates the result; the
# `frame` job turns the raw captures into framed store images + a contact sheet.
#
# macOS minutes are ~10x Linux, so this runs on demand and when the pipeline's own
# files change — not on every PR. The raw capture needs a Mac; framing does not.
#
# CI-ONLY NETWORK STEP: capture/run.ts points the runner's HTTP/HTTPS system proxy
# at the mock proxy, and ONLY when CI=true (this runner is ephemeral). It restores
# the previous state in a `finally`, and a local run refuses to touch network
# settings at all (it prints the manual commands instead).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tooling/store-listing/**'
      - '.github/workflows/store-listing.yml'

permissions:
  contents: read

concurrency:
  group: store-listing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    # macos-15 ships Xcode 26 (iOS 26 SDK + simulator runtime, iPhone 17 Pro Max
    # device type) and is what the repo's other Safari jobs already use. The run
    # needs the iOS 26 Settings layout, so the Xcode floor below is 26.
    runs-on: macos-15
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Same floor-not-pin selection as release.yml / safari-wrapper.yml.
      - name: Select Xcode
        run: |
          set -euo pipefail
          MIN_XCODE_MAJOR=26
          best=""; best_version=""
          for candidate in /Applications/Xcode*.app; do
            [ -d "$candidate" ] || continue
            version="$(/usr/bin/defaults read "$candidate/Contents/Info" CFBundleShortVersionString 2>/dev/null || echo '?')"
            echo "  $candidate → $version"
            case "$version" in ''|'?') continue ;; esac
            [ "${version%%.*}" -ge "$MIN_XCODE_MAJOR" ] 2>/dev/null || continue
            if [ -z "$best" ] || [ "$(printf '%s\n%s\n' "$best_version" "$version" | sort -V | tail -1)" = "$version" ]; then
              best="$candidate"; best_version="$version"
            fi
          done
          [ -n "$best" ] || { echo "::error::No Xcode >= $MIN_XCODE_MAJOR on this runner"; exit 1; }
          sudo xcode-select -s "$best/Contents/Developer"
          echo "DEVELOPER_DIR=$best/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun simctl list runtimes available

      # Maestro hard-pinned to its official release zip, checked by sha256 (the
      # same URL + hash as the vendor tap's 2.11.0 formula, the version the
      # flows were verified on). Not Homebrew: a bare `brew install maestro` is
      # an unrelated cask, and the tap only ever serves the latest release.
      # Maestro needs Java 17+; the runner's own JDK 21 goes on PATH.
      - name: Install Maestro
        env:
          MAESTRO_VERSION: '2.11.0'
          MAESTRO_SHA256: '5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a'
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/maestro"
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          echo "$MAESTRO_SHA256  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          mkdir -p "$dir" && unzip -q "$RUNNER_TEMP/maestro.zip" -d "$dir"
          echo "$dir/maestro/bin" >> "$GITHUB_PATH"
          java_home="${JAVA_HOME_21_arm64:-${JAVA_HOME_21_X64:-}}"
          if [ -n "$java_home" ]; then
            echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
            echo "$java_home/bin" >> "$GITHUB_PATH"
          fi
          PATH="$dir/maestro/bin:${java_home:+$java_home/bin:}$PATH"
          java -version
          actual="$(maestro --version 2>/dev/null | tail -1)"
          echo "maestro $actual"
          [ "$actual" = "$MAESTRO_VERSION" ] || { echo "::error::Maestro $actual != pinned $MAESTRO_VERSION"; exit 1; }

      # One build (universal app), every device and locale (--reuse-build). CI=true
      # is already set by Actions; it is what allows run.ts to change the runner's
      # system proxy. Shots land in captures/<device>/<locale>/.
      - name: Capture iPhone uk
        env:
          CI: 'true'
        run: pnpm --filter @movar/store-listing exec tsx src/capture/run.ts --device iphone --locale uk --out "$GITHUB_WORKSPACE/captures"
      - name: Capture iPhone en
        env:
          CI: 'true'
        run: pnpm --filter @movar/store-listing exec tsx src/capture/run.ts --device iphone --locale en --reuse-build --out "$GITHUB_WORKSPACE/captures"
      - name: Capture iPad uk
        if: ${{ !cancelled() }}
        env:
          CI: 'true'
        run: pnpm --filter @movar/store-listing exec tsx src/capture/run.ts --device ipad --locale uk --reuse-build --out "$GITHUB_WORKSPACE/captures"
      - name: Capture iPad en
        if: ${{ !cancelled() }}
        env:
          CI: 'true'
        run: pnpm --filter @movar/store-listing exec tsx src/capture/run.ts --device ipad --locale en --reuse-build --out "$GITHUB_WORKSPACE/captures"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: store-listing-captures
          path: |
            captures
            tooling/store-listing/.cache/maestro-debug
          if-no-files-found: warn
          # Maestro writes its screenshots and UI tree under `.maestro/`, inside
          # the hidden `.cache/`; without this a failed run uploads nothing.
          include-hidden-files: true

  frame:
    needs: capture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: store-listing-captures
          path: artifact
      - name: Frame
        run: |
          set -euo pipefail
          for device in iphone ipad; do
            for locale in uk en; do
              pnpm --filter @movar/store-listing exec tsx src/render/cli.ts \
                --captures "$GITHUB_WORKSPACE/artifact/captures/$device/$locale" \
                --out "$GITHUB_WORKSPACE/framed/$device/$locale" --locale "$locale" --canvas "$device"
            done
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store-listing-framed
          path: framed
          if-no-files-found: error

