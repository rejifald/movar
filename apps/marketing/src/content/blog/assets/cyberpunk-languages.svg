<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-label="Дві групи смуг: до появи української локалізації 88% гравців з України грали Cyberpunk 2077 російською, 7% англійською, 5% з російськими субтитрами; після — 42% українською, 47% російською, 7% англійською" class="m-chart"><rect width="1200" height="660" fill="var(--chart-bg, #FAFAF9)"></rect><text x="64" y="86" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" fill="var(--chart-ink-strong, #1C1917)">Cyberpunk 2077: чим скінчилися три роки прохань</text><text x="64" y="120" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="20" fill="var(--chart-ink-soft, #78716C)">Мова, якою гравці з України запускали гру, до і після локалізації</text><g><text x="64" y="150" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="700" fill="var(--chart-ink-strong, #1C1917)" text-anchor="start">До української локалізації</text><text x="64" y="176" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="400" fill="var(--chart-ink-faint, #A8A29E)" text-anchor="start">мова, якою грали гравці з України</text><g><text x="394" y="224" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="var(--chart-ink-strong, #1C1917)" text-anchor="end">Російська</text><path d="M408 210 H965.44 A4 4 0 0 1 969.44 214 V224 A4 4 0 0 1 965.44 228 H408 Z" fill="var(--chart-ru, #44403C)"></path><text x="983.44" y="224" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="var(--chart-ink-strong, #1C1917)" text-anchor="start" style="font-variant-numeric:tabular-nums">88%</text></g><g><text x="394" y="264" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="400" fill="var(--chart-ink, #44403C)" text-anchor="end">Повністю англійська</text><path d="M408 250 H448.66 A4 4 0 0 1 452.66 254 V264 A4 4 0 0 1 448.66 268 H408 Z" fill="var(--chart-neutral, #D6D3D1)"></path><text x="466.66" y="264" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="400" fill="var(--chart-ink-soft, #78716C)" text-anchor="start" style="font-variant-numeric:tabular-nums">7%</text></g><g><text x="394" y="292" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="400" fill="var(--chart-ink, #44403C)" text-anchor="end">Російські субтитри,</text><text x="394" y="316" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="400" fill="var(--chart-ink, #44403C)" text-anchor="end">англійська озвучка</text><path d="M408 290 H435.9 A4 4 0 0 1 439.9 294 V304 A4 4 0 0 1 435.9 308 H408 Z" fill="var(--chart-neutral, #D6D3D1)"></path><text x="453.9" y="304" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="400" fill="var(--chart-ink-soft, #78716C)" text-anchor="start" style="font-variant-numeric:tabular-nums">5%</text></g></g><g><text x="64" y="388" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="700" fill="var(--chart-ink-strong, #1C1917)" text-anchor="start">Після — перші два тижні</text><text x="64" y="414" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="400" fill="var(--chart-ink-faint, #A8A29E)" text-anchor="start">локалізація вийшла 21 вересня 2023 року</text><g><text x="394" y="462" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="var(--chart-ua-label, #14532D)" text-anchor="end">Українська</text><path d="M408 448 H671.96 A4 4 0 0 1 675.96 452 V462 A4 4 0 0 1 671.96 466 H408 Z" fill="var(--chart-ua, #15803D)"></path><text x="689.96" y="462" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="var(--chart-ink-strong, #1C1917)" text-anchor="start" style="font-variant-numeric:tabular-nums">42%</text></g><g><text x="394" y="502" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="var(--chart-ink-strong, #1C1917)" text-anchor="end">Російська — субтитри або озвучка</text><path d="M408 488 H703.8599999999999 A4 4 0 0 1 707.8599999999999 492 V502 A4 4 0 0 1 703.8599999999999 506 H408 Z" fill="var(--chart-ru, #44403C)"></path><text x="721.8599999999999" y="502" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="var(--chart-ink-strong, #1C1917)" text-anchor="start" style="font-variant-numeric:tabular-nums">47%</text></g><g><text x="394" y="542" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="400" fill="var(--chart-ink, #44403C)" text-anchor="end">Повністю англійська</text><path d="M408 528 H448.66 A4 4 0 0 1 452.66 532 V542 A4 4 0 0 1 448.66 546 H408 Z" fill="var(--chart-neutral, #D6D3D1)"></path><text x="466.66" y="542" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="400" fill="var(--chart-ink-soft, #78716C)" text-anchor="start" style="font-variant-numeric:tabular-nums">7%</text></g></g><text x="64" y="608" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="16" fill="var(--chart-ink-faint, #A8A29E)">Джерело: дані навела менеджерка локалізації CD Projekt RED Марія Стрільчук; наведено за gamedev.dou.ua</text></svg>
