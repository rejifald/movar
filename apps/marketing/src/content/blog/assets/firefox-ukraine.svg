-sans-serif, system-ui, sans-serif" font-size="16" fill="var(--chart-ink-faint, #A8A29E)">Джерело: Firefox Public Data Report, регіон Ukraine — data.firefox.com/dashboard/usage-behavior.</text><text x="64" y="728" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="16" fill="var(--chart-ink-faint, #A8A29E)">Щотижневий ряд, лютий 2021 — серпень 2026; на графіку сім замірів із нього. Російська попереду української у 1,54 раза.</text></svg>
