<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 862" role="img" aria-label="Драбина з шести сигналів визначення мови сторінки, від найнадійнішого до найслабшого: активний пункт перемикача мов, атрибут html lang, піддомен, сегмент шляху, self-hreflang і текст сторінки" class="m-chart"><rect width="1200" height="862" fill="var(--chart-bg, #FAFAF9)"></rect><text x="64" y="86" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" fill="var(--chart-ink-strong, #1C1917)">Як Мовар визначає мову сторінки</text><text x="64" y="120" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="20" fill="var(--chart-ink-soft, #78716C)">Шість сигналів, від найнадійнішого до найслабшого. Перший, що дав відповідь, вирішує.</text><text x="64" y="160" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="var(--chart-ink-faint, #A8A29E)" text-anchor="start">НАДІЙНІШЕ</text><g><rect x="64" y="178" width="1072" height="84" rx="12" fill="var(--chart-bg, #FAFAF9)" stroke="var(--chart-grid, #E7E5E4)" stroke-width="1"></rect><circle cx="108" cy="220" r="20" fill="var(--chart-ua, #15803D)" fill-opacity="0.12"></circle><text x="108" y="227" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600" fill="var(--chart-ua-label, #14532D)" text-anchor="middle" style="font-variant-numeric:tabular-nums">1</text><text x="148" y="212" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="700" fill="var(--chart-ink-strong, #1C1917)"><tspan>Активний пункт перемикача мов</tspan></text><text x="148" y="238" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="400" fill="var(--chart-ink-soft, #78716C)" text-anchor="start">Його малює той самий код, що малює контент, — вони майже завжди збігаються.</text></g><g><rect x="64" y="274" width="1072" height="84" rx="12" fill="var(--chart-bg, #FAFAF9)" stroke="var(--chart-grid, #E7E5E4)" stroke-width="1"></rect><circle cx="108" cy="316" r="20" fill="var(--chart-ua, #15803D)" fill-opacity="0.12"></circle><text x="108" y="323" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600" fill="var(--chart-ua-label, #14532D)" text-anchor="middle" style="font-variant-numeric:tabular-nums">2</text><text x="148" y="308" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="700" fill="var(--chart-ink-strong, #1C1917)"><tspan>Атрибут</tspan><tspan dx="10" font-weight="600" fill="var(--chart-ua-label, #14532D)">&lt;html lang&gt;</tspan></text><text x="148" y="334" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="400" fill="var(--chart-ink-soft, #78716C)" text-anchor="start">Лежить у шаблоні й живе власним життям: буває ru на всіх без винятку локалях.</text></g><g><rect x="64" y="370" width="1072" height="84" rx="12" fill="var(--chart-bg, #FAFAF9)" stroke="var(--chart-grid, #E7E5E4)" stroke-width="1"></rect><circle cx="108" cy="412" r="20" fill="var(--chart-ua, #15803D)" fill-opacity="0.12"></circle><text x="108" y="419" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600" fill="var(--chart-ua-label, #14532D)" text-anchor="middle" style="font-variant-numeric:tabular-nums">3</text><text x="148" y="404" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="700" fill="var(--chart-ink-strong, #1C1917)"><tspan>Піддомен</tspan><tspan dx="10" font-weight="600" fill="var(--chart-ua-label, #14532D)">ru.example.com</tspan></text><text x="148" y="430" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="400" fill="var(--chart-ink-soft, #78716C)" text-anchor="start">Мовна версія, винесена на окремий хост.</text></g><g><rect x="64" y="466" width="1072" height="84" rx="12" fill="var(--chart-bg, #FAFAF9)" stroke="var(--chart-grid, #E7E5E4)" stroke-width="1"></rect><circle cx="108" cy="508" r="20" fill="var(--chart-ua, #15803D)" fill-opacity="0.12"></circle><text x="108" y="515" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600" fill="var(--chart-ua-label, #14532D)" text-anchor="middle" style="font-variant-numeric:tabular-nums">4</text><text x="148" y="500" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="700" fill="var(--chart-ink-strong, #1C1917)"><tspan>Сегмент шляху</tspan><tspan dx="10" font-weight="600" fill="var(--chart-ua-label, #14532D)">/uk/</tspan></text><text x="148" y="526" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="400" fill="var(--chart-ink-soft, #78716C)" text-anchor="start">Лише строгий збіг: /ru-return-warranty не вважається російською.</text></g><g><rect x="64" y="562" width="1072" height="84" rx="12" fill="var(--chart-bg, #FAFAF9)" stroke="var(--chart-grid, #E7E5E4)" stroke-width="1"></rect><circle cx="108" cy="604" r="20" fill="var(--chart-ua, #15803D)" fill-opacity="0.12"></circle><text x="108" y="611" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600" fill="var(--chart-ua-label, #14532D)" text-anchor="middle" style="font-variant-numeric:tabular-nums">5</text><text x="148" y="596" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="700" fill="var(--chart-ink-strong, #1C1917)"><tspan>self-hreflang</tspan></text><text x="148" y="622" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="400" fill="var(--chart-ink-soft, #78716C)" text-anchor="start">Сторінка сама вказує на себе з мовною міткою.</text></g><g><rect x="64" y="658" width="1072" height="84" rx="12" fill="var(--chart-bg, #FAFAF9)" stroke="var(--chart-grid, #E7E5E4)" stroke-width="1"></rect><circle cx="108" cy="700" r="20" fill="var(--chart-ua, #15803D)" fill-opacity="0.12"></circle><text x="108" y="707" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600" fill="var(--chart-ua-label, #14532D)" text-anchor="middle" style="font-variant-numeric:tabular-nums">6</text><text x="148" y="692" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="700" fill="var(--chart-ink-strong, #1C1917)"><tspan>Текст сторінки</tspan></text><text x="148" y="718" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="400" fill="var(--chart-ink-soft, #78716C)" text-anchor="start">Вбудований у браузер визначник мови, а без нього — franc на таблицях триграм.</text></g><text x="64" y="772" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="var(--chart-ink-faint, #A8A29E)" text-anchor="start">СЛАБШЕ</text><text x="64" y="818" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="18" fill="var(--chart-ink, #44403C)"><tspan>Доказів бракує чи сигнали суперечать один одному? Вердикт — «невідомо», і </tspan><tspan font-weight="700" fill="var(--chart-ua-label, #14532D)">Мовар не чіпає нічого</tspan><tspan>.</tspan></text></svg>
