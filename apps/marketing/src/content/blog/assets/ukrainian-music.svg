<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="Дві пари смуг: частка плейлістів з піснями українською зросла з 34% у 2022 році до 57% у 2025-му, а частка українськомовних пісень, які артисти випускають на закордонну аудиторію, — з 27% до 53%" class="m-chart"><rect width="1200" height="640" fill="var(--chart-bg, #FAFAF9)"></rect><text x="64" y="86" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" fill="var(--chart-ink-strong, #1C1917)">Українська музика за три роки</text><text x="64" y="120" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="20" fill="var(--chart-ink-soft, #78716C)">Що змінилося між 2022 і 2025 роками</text><g><text x="444" y="166" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="var(--chart-ink-strong, #1C1917)" text-anchor="end">Плейлісти з піснями українською</text><text x="444" y="190" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="400" fill="var(--chart-ink-faint, #A8A29E)" text-anchor="end">частка серед плейлістів слухачів</text><g><text x="522" y="168" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="400" fill="var(--chart-ink-faint, #A8A29E)" text-anchor="end" style="font-variant-numeric:tabular-nums">2022</text><path d="M536 150 H712.2 A4 4 0 0 1 716.2 154 V172 A4 4 0 0 1 712.2 176 H536 Z" fill="var(--chart-neutral, #D6D3D1)"></path><text x="730.2" y="168" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="500" fill="var(--chart-ink-soft, #78716C)" text-anchor="start" style="font-variant-numeric:tabular-nums">34%</text></g><g><text x="522" y="206" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="400" fill="var(--chart-ink-faint, #A8A29E)" text-anchor="end" style="font-variant-numeric:tabular-nums">2025</text><path d="M536 188 H834.0999999999999 A4 4 0 0 1 838.0999999999999 192 V210 A4 4 0 0 1 834.0999999999999 214 H536 Z" fill="var(--chart-ua, #15803D)"></path><text x="852.0999999999999" y="206" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="var(--chart-ua-label, #14532D)" text-anchor="start" style="font-variant-numeric:tabular-nums">57%</text></g></g><g><text x="444" y="282" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="var(--chart-ink-strong, #1C1917)" text-anchor="end">Пісні українською на закордон</text><text x="444" y="306" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="400" fill="var(--chart-ink-faint, #A8A29E)" text-anchor="end">частка серед випущеного українськими артистами</text><g><text x="522" y="284" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="400" fill="var(--chart-ink-faint, #A8A29E)" text-anchor="end" style="font-variant-numeric:tabular-nums">2022</text><path d="M536 266 H675.1 A4 4 0 0 1 679.1 270 V288 A4 4 0 0 1 675.1 292 H536 Z" fill="var(--chart-neutral, #D6D3D1)"></path><text x="693.1" y="284" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="500" fill="var(--chart-ink-soft, #78716C)" text-anchor="start" style="font-variant-numeric:tabular-nums">27%</text></g><g><text x="522" y="322" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="400" fill="var(--chart-ink-faint, #A8A29E)" text-anchor="end" style="font-variant-numeric:tabular-nums">2025</text><path d="M536 304 H812.9000000000001 A4 4 0 0 1 816.9000000000001 308 V326 A4 4 0 0 1 812.9000000000001 330 H536 Z" fill="var(--chart-ua, #15803D)"></path><text x="830.9000000000001" y="322" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="var(--chart-ua-label, #14532D)" text-anchor="start" style="font-variant-numeric:tabular-nums">53%</text></g></g><rect x="64" y="396" width="2" height="84" fill="var(--chart-neutral, #D6D3D1)"></rect><text x="82" y="416" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="400" fill="var(--chart-ink, #44403C)" text-anchor="start">Але з іншого боку. За той самий час українські артисти випустили 68 900 пісень</text><text x="82" y="444" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="400" fill="var(--chart-ink, #44403C)" text-anchor="start">— на 39% більше, ніж торік. Девʼять із десяти нових виконавців не набрали</text><text x="82" y="472" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="400" fill="var(--chart-ink, #44403C)" text-anchor="start">й тисячі прослуховувань.</text><text x="64" y="565" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="16" fill="var(--chart-ink-faint, #A8A29E)">Джерело: дослідження «Музика має силу» — звукозаписна компанія Pomitni разом з дослідницькими</text><text x="64" y="588" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="16" fill="var(--chart-ink-faint, #A8A29E)">агенціями Dive та Discovery Research, оприлюднене у вересні 2025 року.</text></svg>
