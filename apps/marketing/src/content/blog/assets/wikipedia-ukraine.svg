<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Три смуги, поділені за мовами: у 2013 році з України 71,1% переглядів припадало на російську Wikipedia і 16,4% на українську; у 2024-му — 45,0% і 39,2%; у вересні 2025-го — 45,7% і 33,6%" class="m-chart"><rect width="1200" height="600" fill="var(--chart-bg, #FAFAF9)"></rect><text x="64" y="86" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" fill="var(--chart-ink-strong, #1C1917)">Яку Wikipedia читають в Україні</text><text x="64" y="120" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="20" fill="var(--chart-ink-soft, #57534E)">Частка переглядів, що надходять з України, за мовним розділом</text><g><text x="274" y="180" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="700" fill="var(--chart-ink-strong, #1C1917)" text-anchor="end" style="font-variant-numeric:tabular-nums">2013</text><text x="274" y="206" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="400" fill="var(--chart-ink-faint, #525252)" text-anchor="end">за рік</text><g><rect x="298" y="150" width="137.432" height="62" fill="var(--chart-ua, #15803D)"></rect><text x="366.716" y="189" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="var(--chart-on-ua, #FFFFFF)" text-anchor="middle" style="font-variant-numeric:tabular-nums">16,4%</text></g><g><rect x="435.432" y="150" width="595.818" height="62" fill="var(--chart-ru, #44403C)"></rect><text x="733.341" y="189" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="var(--chart-on-ru, #FFFFFF)" text-anchor="middle" style="font-variant-numeric:tabular-nums">71,1%</text></g><g><rect x="1031.25" y="150" width="67.878" height="62" fill="var(--chart-neutral, #D6D3D1)"></rect></g><g><rect x="1099.1280000000002" y="150" width="36.87200000000001" height="62" fill="var(--chart-neutral-soft, #EBE9E7)"></rect></g></g><g><text x="274" y="268" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="700" fill="var(--chart-ink-strong, #1C1917)" text-anchor="end" style="font-variant-numeric:tabular-nums">2024</text><text x="274" y="294" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="400" fill="var(--chart-ink-faint, #525252)" text-anchor="end">за рік</text><g><rect x="298" y="238" width="328.49600000000004" height="62" fill="var(--chart-ua, #15803D)"></rect><text x="462.24800000000005" y="277" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="var(--chart-on-ua, #FFFFFF)" text-anchor="middle" style="font-variant-numeric:tabular-nums">39,2%</text></g><g><rect x="626.4960000000001" y="238" width="377.1" height="62" fill="var(--chart-ru, #44403C)"></rect><text x="815.046" y="277" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="var(--chart-on-ru, #FFFFFF)" text-anchor="middle" style="font-variant-numeric:tabular-nums">45,0%</text></g><g><rect x="1003.596" y="238" width="87.99" height="62" fill="var(--chart-neutral, #D6D3D1)"></rect><text x="1047.591" y="277" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="var(--chart-ink-strong, #1C1917)" text-anchor="middle" style="font-variant-numeric:tabular-nums">10,5%</text></g><g><rect x="1091.586" y="238" width="44.414" height="62" fill="var(--chart-neutral-soft, #EBE9E7)"></rect></g></g><g><text x="274" y="356" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="700" fill="var(--chart-ink-strong, #1C1917)" text-anchor="end" style="font-variant-numeric:tabular-nums">вересень 2025</text><text x="274" y="382" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="400" fill="var(--chart-ink-faint, #525252)" text-anchor="end">за місяць</text><g><rect x="298" y="326" width="281.56800000000004" height="62" fill="var(--chart-ua, #15803D)"></rect><text x="438.784" y="365" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="var(--chart-on-ua, #FFFFFF)" text-anchor="middle" style="font-variant-numeric:tabular-nums">33,6%</text></g><g><rect x="579.568" y="326" width="382.966" height="62" fill="var(--chart-ru, #44403C)"></rect><text x="771.0509999999999" y="365" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="var(--chart-on-ru, #FFFFFF)" text-anchor="middle" style="font-variant-numeric:tabular-nums">45,7%</text></g><g><rect x="962.5340000000001" y="326" width="108.102" height="62" fill="var(--chart-neutral, #D6D3D1)"></rect><text x="1016.5850000000002" y="365" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="var(--chart-ink-strong, #1C1917)" text-anchor="middle" style="font-variant-numeric:tabular-nums">12,9%</text></g><g><rect x="1070.636" y="326" width="65.364" height="62" fill="var(--chart-neutral-soft, #EBE9E7)"></rect></g></g><g><rect x="298" y="436" width="14" height="14" rx="3" fill="var(--chart-ua, #15803D)"></rect><text x="320" y="448" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600" fill="var(--chart-ua-label, #14532D)" text-anchor="start">українська</text></g><g><rect x="448" y="436" width="14" height="14" rx="3" fill="var(--chart-ru, #44403C)"></rect><text x="470" y="448" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600" fill="var(--chart-ink-strong, #1C1917)" text-anchor="start">російська</text></g><g><rect x="598" y="436" width="14" height="14" rx="3" fill="var(--chart-neutral, #D6D3D1)"></rect><text x="620" y="448" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600" fill="var(--chart-ink-soft, #57534E)" text-anchor="start">англійська</text></g><g><rect x="748" y="436" width="14" height="14" rx="3" fill="var(--chart-neutral-soft, #EBE9E7)"></rect><text x="770" y="448" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600" fill="var(--chart-ink-soft, #57534E)" text-anchor="start">інші</text></g><text x="64" y="525" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="16" fill="var(--chart-ink-faint, #525252)">Джерело: статистика Wikimedia, наведена у статті «Українська Вікіпедія», та дані Chytomo.</text><text x="64" y="548" font-family="&#x27;Fixel Text&#x27;, ui-sans-serif, system-ui, sans-serif" font-size="16" fill="var(--chart-ink-faint, #525252)">Рядки за 2013 і 2024 роки — річні, останній — за один місяць, тож порівнювати їх навпростець не можна.</text></svg>
