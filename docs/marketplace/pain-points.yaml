# Machine-readable mirror of pain-points.md.
#
# Purpose: let solution/design docs reference pains by stable ID and let us check that every
# pain is eventually addressed by something. The prose in pain-points.md carries the evidence
# and the argument; this file carries the structure.
#
# Keep the two in sync when either changes. IDs are permanent — withdraw, never reuse.
#
# status:   open | partial | siloed | constraint
# severity: high | medium | low
# source:   seed (founder raised it) | research (this investigation surfaced it)
# evidence: absent   = backed by the original fact-checked research run
#           verified = re-checked against live platform documentation in a later pass
#           reasoned = analysis only, NOT checked against any platform or user complaint
# blocked_by: pains that must be solved first for this one to be solvable at all

meta:
  compiled: 2026-07-18
  market: Ukraine
  scope: C2C and B2C marketplace for goods and services
  total: 54
  counts: { open: 34, partial: 16, siloed: 1, constraint: 3 }
  evidence_tiers:
    unmarked: Backed by the original fact-checked research run.
    verified: Checked against live platform documentation in a later pass.
    reasoned: >-
      Analysis only — not checked against any platform or user complaint. Useful for thinking,
      not yet safe to plan around. Covers the whole SVC group, DISC-01, OPS-03, TRUST-10, TRUST-11.
  structural_findings:
    - id: missing-product-identity
      summary: No catalogue primitive; a listing is free text, not an instance of a known product.
      symptoms: [IDENT-01, IDENT-02, IDENT-03, IDENT-04, IDENT-05, EXP-01, EXP-04]
    - id: missing-public-conversation
      summary: All contact is 1:1 private chat, so nothing is reusable and nothing is observable.
      symptoms: [COMM-01, COMM-02, COMM-04, TRUST-01]
    - id: services-matched-never-managed
      summary: >-
        Platforms broker the introduction to a service provider then withdraw. Escrow is shaped
        for a parcel, so any job needing staged payment, a change order or a warranty must leave
        the platform to happen at all.
      symptoms: [SVC-01, SVC-02, SVC-03, SVC-04, SVC-05, SVC-06]
    - id: missing-relationship-memory
      summary: >-
        Platforms model listings and weakly model identities, but never the relationship between
        two people. Facebook and Telegram beat every Ukrainian marketplace here, because a chat
        app gets history-with-a-person and a block button for free.
      symptoms: [TRUST-02, TRUST-06, TRUST-07, COMM-03]

pains:
  # --- TRUST ---------------------------------------------------------------
  - id: TRUST-01
    title: Fraud that impersonates the platform's own rails
    status: partial
    severity: high
    source: seed
    requirement: Make off-platform migration unattractive rather than forbidden; keep negotiation observable.
    related: [ECON-02, COMM-03]
  - id: TRUST-02
    title: Reputation is neither portable nor transaction-bound
    status: open
    severity: high
    source: seed
    requirement: Bind reputation to completed paid transactions; make the identity expensive to discard.
  - id: TRUST-03
    title: Reputation burying is built into the infrastructure
    status: open
    severity: high
    source: seed
    requirement: Append-only complete history; resist recency-window gaming; never tie a money event to a unilaterally fakeable action.
    related: [TRUST-02]
  - id: TRUST-04
    title: Escrow exists; adjudication does not
    status: partial
    severity: high
    source: seed
    requirement: Own the ruling, not just the wallet — evidence capture, stated decision standard, funded refund path.
  - id: TRUST-05
    title: Liability is disclaimed onto the carrier
    status: open
    severity: medium
    source: research
    requirement: Absorb first-line liability and pursue the carrier ourselves.
    blocked_by: [TRUST-04]
  - id: TRUST-06
    title: No counterparty history
    status: open
    severity: medium
    source: seed
    requirement: Treat the counterparty as a first-class entity — every interaction with a person visible in one place, for both sides.
    note: Distinct from TRUST-02. Reputation is what strangers think; this is what you already know, and it cannot be bought or brigaded.
    related: [TRUST-02, TRUST-07]
  - id: TRUST-07
    title: No user-initiated blocking
    status: open
    severity: medium
    source: seed
    requirement: Let either side permanently decline a counterparty without proving wrongdoing; block is mutual in effect (listings hidden, contact impossible).
    note: >-
      Blocking exists on UA platforms but means admin-imposed punishment for rule violations.
      Reporting asks a moderator to judge; blocking is a personal boundary needing no justification.
    related: [TRUST-06, COMM-03]
  - id: TRUST-08
    title: Identity verification is missing where it matters most
    status: partial
    severity: high
    source: seed
    evidence: verified
    requirement: Verify identity at account level, display it distinctly from performance signals, make it the default not a premium tier.
    note: >-
      Not white space — Kabanchik ("Перевірений виконавець", passport selfie or Дія-шерінг),
      AUTO.RIA/DOM.RIA ("Перевірений продавець", BankID + fraud screening) and Shafa all verify.
      OLX is phone-only by default. Trap: Shafa's "Супер-продавець" is performance-based, not
      identity — conflating the two destroys the meaning of both.
  - id: TRUST-09
    title: No verifiable status claims
    status: open
    severity: medium
    source: seed
    evidence: verified
    requirement: Treat each claim as an attestation with recorded source and method; be honest about auto-checked vs self-presented.
    note: >-
      Feasibility differs per claim. ФОП/ЄДРПОУ fully public; charity register publicly
      searchable; volunteer register needs a request to ДПС for a named ІПН; veteran/УБД has NO
      third-party lookup — extracts restricted to the person, so it must be self-presented via
      Дія-шерінг. Unverifiable volunteer/military claims are an established fraud vector.
    related: [TRUST-08, SVC-05]
  - id: TRUST-10
    title: Listing theft
    status: open
    severity: medium
    source: research
    evidence: reasoned
    requirement: Detect duplicate media across listings; give the original poster a fast path to challenge a copy.
    note: Distinct from TRUST-01 — that phishes the seller; this uses the seller's work to defraud someone else.
  - id: TRUST-11
    title: Counterfeit, stolen and prohibited goods
    status: partial
    severity: medium
    source: research
    evidence: reasoned
    requirement: Make provenance cheap to prove for honest sellers rather than violations expensive to catch afterwards.
    related: [IDENT-05]
  - id: TRUST-12
    title: No reliability signals
    status: open
    severity: medium
    source: research
    evidence: verified
    requirement: Publish behavioural reliability (response rate/time, completion, cancellation) separately from satisfaction ratings.
    note: >-
      OLX shows a 1–5★ rating plus tags only. Shafa encodes completion ≥70% / response ≥90% into
      an opaque "Супер-продавець" badge rather than showing the numbers.
    related: [OPS-03]

  # --- ECON ----------------------------------------------------------------
  - id: ECON-01
    title: Take-rates that force disintermediation
    status: open
    severity: high
    source: research
    requirement: Price so that staying is cheaper than the hassle of leaving.
  - id: ECON-02
    title: Nothing makes staying on-platform strictly better
    status: open
    severity: high
    source: seed
    requirement: Bind escrow, reputation, dispute rights, delivery and history to on-platform settlement so leaving forfeits all of them at once.
    related: [TRUST-01, TRUST-02, TRUST-04, ECON-01]
  - id: ECON-03
    title: Fee fragmentation and no take-home preview
    status: partial
    severity: medium
    source: research
    requirement: One "you will receive X" figure at listing time, before commitment.
  - id: ECON-04
    title: Refund and delivery-cost asymmetry
    status: open
    severity: low
    source: research
    requirement: The party at fault bears the cost.
    blocked_by: [TRUST-04]
  - id: ECON-05
    title: The publishing gauntlet
    status: open
    severity: medium
    source: seed
    requirement: No interstitials on the publish path; sell promotion after the listing is live, from performance evidence.
    related: [EXP-03]
  - id: ECON-06
    title: Pay-to-stay-visible and listing quotas
    status: partial
    severity: medium
    source: research
    requirement: Rank on relevance and conduct, never on payment status.

  # --- IDENT ---------------------------------------------------------------
  - id: IDENT-01
    title: No product catalogue
    status: open
    severity: high
    source: research
    requirement: Attach listings to a product entity, with a non-degrading path for one-off items.
  - id: IDENT-02
    title: No new-vs-used price anchor
    status: open
    severity: high
    source: seed
    requirement: Show retail price beside asking price; make the saving the headline number.
    blocked_by: [IDENT-01]
  - id: IDENT-03
    title: No canonical spec page to point at
    status: open
    severity: medium
    source: seed
    requirement: Native canonical-product attachment rendering specs in-listing — not raw outbound links.
    blocked_by: [IDENT-01]
  - id: IDENT-04
    title: No pricing guidance
    status: open
    severity: high
    source: seed
    requirement: Price from comparable completed sales.
    blocked_by: [IDENT-01]
  - id: IDENT-05
    title: No cost basis or receipt tracking
    status: open
    severity: medium
    source: seed
    requirement: Attach receipts; show paid-vs-recovered privately and proof-of-purchase publicly.
  - id: IDENT-06
    title: Condition is a checkbox, not a description
    status: partial
    severity: high
    source: research
    evidence: verified
    requirement: Grade condition per category, require flaw photos above a threshold, treat disclosure as dispute evidence.
    note: >-
      OLX requires a binary "нове"/"б/у" with no defect photos; Shafa requires defects described
      in text only. The field exists — its resolution is the problem. Largest generator of the
      "not as described" disputes TRUST-04 must adjudicate.
    related: [TRUST-04]

  # --- COMM ----------------------------------------------------------------
  - id: COMM-01
    title: No public Q&A on listings
    status: open
    severity: high
    source: seed
    requirement: Answers public and reusable by default; private chat as the exception.
  - id: COMM-02
    title: No tender flow with a clarification round
    status: open
    severity: high
    source: seed
    requirement: Dedupe questions across bidders, publish answers to all, version requirements so offers are comparable.
    related: [COMM-01]
  - id: COMM-03
    title: No contact-channel preference
    status: open
    severity: medium
    source: seed
    requirement: Per-listing seller preference the platform enforces, defaulting to written and on-platform.
    related: [TRUST-01]
  - id: COMM-04
    title: Spam and low-quality contact volume
    status: partial
    severity: medium
    source: seed
    requirement: Remove the reason for repetitive contact before adding filters against it.
    blocked_by: [COMM-01]

  # --- DISC (buyer-side discovery) ---------------------------------------
  - id: DISC-01
    title: Search and taxonomy quality
    status: partial
    severity: high
    source: research
    evidence: reasoned
    requirement: Derive filters from catalogue attributes rather than free seller tagging; let people search the way they speak.
    blocked_by: [IDENT-01]
  - id: DISC-02
    title: Alerts exist but are shallow
    status: partial
    severity: medium
    source: research
    evidence: verified
    requirement: Treat a saved search as a standing want with price and condition thresholds.
    note: >-
      NOT white space. OLX has "Зберегти параметри пошуку"; AUTO.RIA supports "підписатися" on a
      saved search. monobazar has no filter subscriptions. Missing depth: no price thresholds,
      no relist-cheaper alerts, no cross-platform following.
    related: [DISC-03]
  - id: DISC-03
    title: No want-ads
    status: open
    severity: medium
    source: research
    evidence: verified
    requirement: Make demand a first-class object with the same identity, price and condition structure as supply.
    note: >-
      OLX actively disallows "Куплю" listings in most categories. Incumbents refuse demand
      listings because they are hard to monetise with promotion and attract spam — which is why
      a platform not dependent on promotion revenue can occupy the space.
    related: [TXN-06]
  - id: DISC-04
    title: Stale listings, and reporting shaped for abuse rather than accuracy
    status: partial
    severity: high
    source: seed
    evidence: verified
    requirement: >-
      Accept accuracy feedback as a low-friction signal separate from abuse reporting, put it on
      a clock with an automatic outcome, tell the reporter what happened, and route
      unresponsiveness into reliability rather than a moderation queue.
    note: >-
      Not absent — OLX's per-listing "Поскаржитися" includes a not-current/sold reason, and
      AUTO.RIA expires listings after 30 days (90-day cap). DOM.RIA is the model: a buyer
      complaint gives the seller 7 days to respond or the listing auto-deletes, a second
      complaint removes it outright, plus "Підтвердити актуальність" prompts with auto-archive.
      A report needs a state machine, not an inbox. Incentives explain the gap — culling cuts
      inventory counts and the promotion revenue riding on them (ECON-06); DOM.RIA culls hardest
      because current verified inventory is its product.
    related: [DISC-01, COMM-01, COMM-04, TRUST-12, ECON-06]

  # --- TXN -----------------------------------------------------------------
  - id: TXN-01
    title: Bargaining is unstructured
    status: partial
    severity: medium
    source: seed
    requirement: Formal offer, counter, expiry, auto-accept threshold, offer history.
    note: Live feature race — monobazar shipped it, OLX followed.
  - id: TXN-02
    title: Auctions exist only for collectors
    status: siloed
    severity: medium
    source: seed
    requirement: Auction format available for price-uncertain items in any category.
  - id: TXN-03
    title: No rental or lease for goods
    status: open
    severity: medium
    source: seed
    requirement: Availability calendar, deposit handling, condition-on-return check, damage dispute path.
    blocked_by: [TRUST-04]
  - id: TXN-04
    title: No multi-quantity support
    status: open
    severity: medium
    source: seed
    requirement: Stock levels and variants on a single listing.
    blocked_by: [IDENT-01]
  - id: TXN-05
    title: No bulk selling
    status: open
    severity: medium
    source: seed
    requirement: Bulk upload, batch edit, batch reprice.
  - id: TXN-06
    title: No consignment or commission resale
    status: open
    severity: high
    source: seed
    requirement: Hand items to a seller-on-your-behalf with custody, cut, and condition dispute handling.
    blocked_by: [IDENT-01, IDENT-05, TRUST-04]

  # --- SVC (service execution; whole group is reasoned, not researched) ---
  - id: SVC-01
    title: No staged or milestone payments
    status: open
    severity: high
    source: research
    evidence: reasoned
    requirement: Money released against milestones, so a multi-week job can settle on-platform at all.
    note: The mechanism by which large service jobs leave the platform, taking TRUST-04 and TRUST-02 with them.
    related: [ECON-02, TRUST-04]
  - id: SVC-02
    title: No change orders
    status: open
    severity: high
    source: research
    evidence: reasoned
    requirement: Structured mid-job amendment to scope and price, versioned against the original agreement.
    note: Without it the agreed spec stops describing the work and disputes have nothing to adjudicate against.
    related: [COMM-02]
  - id: SVC-03
    title: No proof of work
    status: open
    severity: medium
    source: research
    evidence: reasoned
    requirement: Before/after evidence capture and completion sign-off.
    related: [IDENT-06, TRUST-04]
  - id: SVC-04
    title: No scheduling
    status: open
    severity: medium
    source: research
    evidence: reasoned
    requirement: Availability, booking and rescheduling in-product; an executor's calendar should inform matching.
    related: [ECON-02]
  - id: SVC-05
    title: No qualification or licence verification
    status: open
    severity: medium
    source: research
    evidence: reasoned
    requirement: Verify competence, not just identity — attestation with a source and a method.
    note: TRUST-08 answers "who is this person"; nothing answers "can they do this safely".
    related: [TRUST-08, TRUST-09]
  - id: SVC-06
    title: No warranty on completed work
    status: open
    severity: medium
    source: research
    evidence: reasoned
    requirement: Retention period or warranty window after completion.
    note: A protection that cannot exist in a cash deal — so it is a strong argument for on-platform settlement.
    related: [ECON-02]

  # --- EXP -----------------------------------------------------------------
  - id: EXP-01
    title: No guidance through listing creation
    status: open
    severity: high
    source: seed
    requirement: Guide photos, attributes, condition wording; never present an empty form.
  - id: EXP-02
    title: AI listing help is already half-taken
    status: partial
    severity: medium
    source: seed
    requirement: Photo improvement, condition assessment from images, category auto-detection, price suggestion.
    note: monobazar ships AI descriptions. Adoption accelerant, never the moat.
  - id: EXP-03
    title: The product forgets who you are
    status: open
    severity: medium
    source: seed
    requirement: Derive defaults from profile and prior listings; ask only what varies per item.
    related: [ECON-05]
  - id: EXP-04
    title: Thin seller analytics
    status: partial
    severity: low
    source: seed
    requirement: Price comparison, why-not-selling diagnosis, sold comparables, promotion ROI.
    blocked_by: [IDENT-01]
  - id: EXP-05
    title: Interface quality
    status: partial
    severity: medium
    source: seed
    requirement: Fix the structural failures, not generic polish — polish is not defensible.
  - id: EXP-06
    title: Support quality and dispute latency
    status: partial
    severity: medium
    source: research
    requirement: In-app resolution flow; never route a dispute to email.
    related: [TRUST-04]
  - id: EXP-07
    title: Cross-posting burden
    status: open
    severity: medium
    source: seed
    requirement: Publish to other platforms from one composer and retract everywhere on sale.
    note: >-
      Strategic wedge: whoever solves cross-posting sits above the platforms rather than beside
      them and sees supply first — useful on day one, before we have buyers of our own.
    related: [COMM-04]

  # --- OPS (external constraints, not competitor gaps) ----------------------
  - id: OPS-01
    title: Cash-on-delivery rail limits
    status: constraint
    severity: high
    source: research
    detail: >-
      Nova Poshta inspect-before-pay does not work at поштомат lockers (payment precedes
      opening). Since June 2025 individuals without ФОП status are capped at ~5 COD shipments
      per month and 30,000 UAH.
    requirement: Design the casual-seller to small-business transition, including the legal boundary.
  - id: OPS-02
    title: Legal provability of informal sales
    status: constraint
    severity: medium
    source: research
    detail: >-
      Social-channel sellers are not registered entities, so purchases cannot be legally
      proven; the Consumers Union of Ukraine estimates over half are fraudsters.
    requirement: Provide the recourse the informal market structurally cannot.
  - id: OPS-03
    title: The war is a permanent operating condition
    status: constraint
    severity: high
    source: research
    evidence: reasoned
    detail: >-
      Delivery does not reach every region and reachability changes; displacement makes saved
      addresses unstable; blackouts and alerts make response time a poor reliability signal;
      mobilisation can interrupt a job mid-way; fixed dispute windows punish whoever is having
      the worse week.
    requirement: >-
      Treat disruption as the normal case, not an exception, and never ask a user to document a
      hardship in order to be treated fairly. Most war-related circumstance is unverifiable;
      only some war-related status is (see TRUST-09).
    related: [TRUST-09, TRUST-12, SVC-01, SVC-02, TRUST-04]
