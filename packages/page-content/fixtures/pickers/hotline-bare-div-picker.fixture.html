<!doctype html>
<!--
  hotline.ua product page capture (2026-08-22), trimmed per the corpus README.

  Why this fixture exists: BOTH switcher entries are bare, href-less
  <div class="lang__link"> — Vue owns the click, so neither is an anchor or a
  button. "This entry cannot switch anywhere, so it must be the one we are on"
  therefore fires on BOTH, and reading the FIRST in DOM order made every
  Ukrainian page on the site detect as Russian. The real marker is the
  `lang__link--disabled` modifier on the CURRENT language, an inverted
  convention (`active`/`current`/`selected` is what ACTIVE_CLASS_PATTERN knows).

  The damage was not the wrong verdict on its own. `ru` is a blocked language,
  so the switch ladder engaged, and hotline publishes a CANONICAL, query-less
  `uk-UA` alternate — so following it replaced the URL and dropped the query on
  every product/tab/sort link that carried one. Hence the two pieces of
  contaminating chrome kept below: the <link rel="alternate"> pair, and a
  product link with a `?series=true` query. Trimmed to those plus enough
  Ukrainian body text to make the page's real language unambiguous.

  The picker markup is verbatim (Vue's `data-v-*` scope attributes included).
  The shape pin anchors on `[data-eventLabel]` and `.lang__link--disabled`,
  never on the `data-v-*` build hashes.

  Verdict surface: @movar/lang-pickers classification + active-entry detection,
  @movar/page-language detection, and the switch ladder's navigation verdict.
-->

    />
    <link
      rel="alternate"

    />
  </head>
  <body>

          рус
