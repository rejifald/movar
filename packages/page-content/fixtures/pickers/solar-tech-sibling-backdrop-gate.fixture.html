<!doctype html>
<!--
  solar-tech.com.ua product page capture (2026-11-25). Trimmed per the corpus README.

  The page is ALREADY Ukrainian (<html lang="uk">, /ua/ path) and still throws up
  a «Якою мовою Ви бажаєте переглянути наш сайт?» gate. Its shape is what makes
  it worth a fixture: the fixed wrapper `#language-form` is a 505px column
  (max-width + margin:auto), NOT a full-viewport box, and the full-viewport dim
  layer `.overlay` is the panel's SIBLING inside it. No ancestor of the picker
  covers the viewport, so an ancestor-only gate check misses it; findGateOverlay
  finds it by hit-testing for a covering backdrop painted beneath the picker.
  Both modal anchors are cookie-setting links; the Ukrainian one is this URL.

  Contaminating chrome: the same page carries two ordinary in-flow switchers
  (desktop `#header_lang` form, `.mobile_lang`) with the same ru/ua entries.
  All three classify as pickers; only the modal is a gate.

  Verdict surface: @movar/lang-pickers classification. The gate geometry and
  hit-test need layout (jsdom has none) — see
  packages/lang-pickers/src/picker.gate.test.ts with stubbed rects/hit stacks.
-->
