# Movar host app > "Hide content" > turn the content-hiding toggle ON.
# The row has no accessibility identifier (labels are localized SwiftUI text),
# and the switch is a UISwitch, so it is tapped by position, then asserted.
appId: fyi.movar.safari
---
- launchApp:
    appId: fyi.movar.safari
    stopApp: true
- scrollUntilVisible:
    element: ${L_HIDE_CONTENT}
    timeout: 90000
- tapOn: ${L_HIDE_CONTENT}
- extendedWaitUntil:
    visible: ${L_TOGGLE_LABEL}
    timeout: 60000
- tapOn:
    point: '84%,20%'
- extendedWaitUntil:
    visible: ${L_CONCEAL_HOW}
    timeout: 60000
